<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="50%" stop-color="#ff9e00" />
      <stop offset="100%" stop-color="#ff5400" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffa200" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff3c00" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#ff7b00" stroke-width="2" stroke-opacity="0.3" />

  <!-- Outer Hexagon Barrier (AT Field Motif) -->
  <polygon points="64,18 104,41 104,87 64,110 24,87 24,41"
           fill="url(#glowGrad)"
           stroke="url(#hexGrad)"
           stroke-width="5"
           stroke-linejoin="round"
           filter="url(#glow)" />

  <!-- Middle Concentric Hexagon -->
  <polygon points="64,30 92,46 92,82 64,98 36,82 36,46"
           fill="none"
           stroke="#ffaa00"
           stroke-width="2.5"
           stroke-opacity="0.75"
           stroke-dasharray="6 3" />

  <!-- Center Shield Core (Chat Mask Overlay representation) -->
  <rect x="46" y="50" width="36" height="28" rx="6"
        fill="#141416"
        stroke="#ff7b00"
        stroke-width="3" />

  <!-- Masking Diagonal Hatch Lines -->
  <line x1="52" y1="56" x2="76" y2="72" stroke="#ff9e00" stroke-width="2" stroke-linecap="round" />
  <line x1="52" y1="64" x2="68" y2="74" stroke="#ff9e00" stroke-width="2" stroke-linecap="round" />
  <line x1="60" y1="54" x2="76" y2="64" stroke="#ff9e00" stroke-width="2" stroke-linecap="round" />
</svg>
